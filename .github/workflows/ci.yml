name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer irrelevant, so it is
# cancelled rather than finished. Not on main: a run there is validating what has
# already landed, and cancelling it would leave the branch everyone builds on
# with no answer at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    # Both targets, every time. The whole point of the move off Swift is that
    # Windows is a first-class target; a macOS-only CI would let it rot.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StrangeSharpTerm.slnx
      - run: dotnet build StrangeSharpTerm.slnx -c Release --no-restore --nologo
      # No --nologo: in Microsoft.Testing.Platform mode it is forwarded to the
      # test executable, which rejects it (exit 5). See build/test.sh.
      - run: dotnet test --solution StrangeSharpTerm.slnx -c Release --no-build

  # The real acceptance gate: an unprivileged sshd on loopback, driven through
  # stctl. It needs no Docker and no admin rights on macOS; on Windows it installs
  # the OpenSSH server capability if the image lacks it.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integration test (macOS)
        if: runner.os == 'macOS'
        run: ./build/integration-test.sh
      - name: Integration test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/integration-test.ps1

  # M8's gate: the packaging scripts themselves, on both platforms, every time.
  #
  # Unsigned and unnotarised, because those need credentials a pull request
  # cannot have -- but everything up to them is exactly what a release does, and
  # it is the part that breaks silently. The macOS script signs ad-hoc, verifies
  # every one of ~245 nested files, and starts the bundle; a publish that cannot
  # load its own runtime fails here rather than after notarisation.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./build/package.sh
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-unsigned
          path: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
          if-no-files-found: error
          retention-days: 7
