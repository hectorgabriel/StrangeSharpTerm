<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3dffb0"/>
      <stop offset="100%" stop-color="#00c3ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#sheen)"/>
  <rect x="6" y="6" width="500" height="500" rx="90" fill="none" stroke="#1e2833" stroke-width="2"/>

  <!-- prompt symbol > with refined proportions -->
  <g filter="url(#glow)">
    <path d="M 150 190 L 262 256 L 150 322"
          fill="none" stroke="url(#neonGrad)"
          stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cursor -->
  <g filter="url(#glow)">
    <rect x="296" y="286" width="96" height="26" rx="6" fill="url(#neonGrad)"/>
  </g>

  <!-- sharp (#) symbol, nodding to C# / Avalonia UI -->
  <g filter="url(#glow)" stroke="url(#neonGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="330" y1="150" x2="314" y2="230"/>
    <line x1="378" y1="150" x2="362" y2="230"/>
    <line x1="304" y1="176" x2="392" y2="176"/>
    <line x1="300" y1="204" x2="388" y2="204"/>
  </g>
</svg>
